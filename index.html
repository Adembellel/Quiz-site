<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Learning Pods: Weekly Quizzes</title>
<style>
:root{--bg:#f6f3ec;--fg:#1b1f3b;--card:#fff;--bd:#e4dfd3;--ac:#d9622b;--mu:#6b6f86;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f3b;--fg:#f6f3ec;--card:#262b52;--bd:#383e6e;--mu:#aab0d0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1f3b;--fg:#f6f3ec;--card:#262b52;--bd:#383e6e;--mu:#aab0d0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Helvetica,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:30px;margin:0 0 4px}h2{font-size:22px}p.mu,.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:16px 0}
.card,.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.topic{text-align:left;font-size:18px}.topic small{display:block;color:var(--mu);font-size:13px}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
label.o{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;cursor:pointer}
label.o:has(input:checked){border-color:var(--ac);background:var(--bg)}
.lv{margin:28px 0 8px;color:var(--ac);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:48px;font-weight:700;margin:0}.err{color:#c0392b;font-weight:700}
.top{display:flex;justify-content:space-between;margin-bottom:8px}table{border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 10px;text-align:left;white-space:nowrap}.tc{display:flex;flex-direction:column;gap:6px}.tc .topic{flex:1}.ed{font-size:13px}label{display:block;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.ov .card{max-width:440px}.sw{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:40;width:58px;height:30px;border-radius:15px;border:1px solid var(--bd);background:var(--card);padding:0}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ac);transition:transform .2s;display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal}.sw[aria-checked=true] i{transform:translateX(28px)}main{padding-top:56px}select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);max-width:100%}input[type=number],input[type=datetime-local]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);box-sizing:border-box;max-width:100%}.q{margin:12px 0}main{max-width:900px}</style></head><body><main id="app"></main><button id="th" class="sw" role="switch" aria-label="Dark mode" aria-checked="false"><i></i></button>
<script>
const API="https://script.google.com/macros/s/AKfycbwMyOAvUDFrGT_1nnZRF5mQhG8UccLvZ74rsVH0ujYCGc8WLGG_WD5hmFMsSdveJTlq4A/exec";
const S={en:{title:"Weekly quizzes",intro:"Pick your topic, then choose an open quiz. Your supervisor decides when each quiz opens and closes.",topics:"Topics",open_n:"open",back:"← Back",closes:"Closes",opens:"Opens",start:"Start",soon:"Not open yet",none:"No quizzes right now.",nm:"Your name",dc:"Discord username",pod:"Pod number",ql:"Quiz language",need:"Please fill in your name, Discord username and pod number.",sub:"Submit",cfT:"Submit your answers?",cfB:"You are submitting as {n} ({d}), pod {p}. You can’t change your answers afterwards.",yes:"Yes, submit",no:"Go back",score:"Your score",pending:"Some answers still need marking by your supervisor. Your final score will be updated.",sent:"Your result was sent to your supervisor ✓",conn:"Couldn’t connect. Please try again in a moment.",nosetup:"This site isn’t connected yet.",tzn:"All times are in Algeria time.",att:"Attempts allowed",unl:"unlimited",e_attempts:"You have no attempts left for this quiz.",e_closed:"This quiz is closed.",e_notopen:"This quiz is not open yet.",e_notfound:"This quiz doesn’t exist.",e_other:"Something went wrong. Please try again.",right:"Correct",wrong:"Wrong",corr:"Correct answer",model:"Model answer",ph:"Write your answer",q:"Question",pts:"pts",wait:"Loading…",labs:"Lab work",upload:"Upload",choose_files:"Choose your file(s)",receipt:"Receipt code",receipt_hint:"Only if you already submitted this lab and want to replace your files.",got_receipt:"Your receipt code",keep:"Keep this code. You need it to see your mark or to replace your files.",copy:"Copy",copied:"Copied ✓",uploaded:"Your files were sent privately to your supervisor ✓",replaced:"Your previous files were replaced ✓",max_files:"Files allowed",max_size:"Max 5 MB per file",check_mark:"Check my lab mark",enter_receipt:"Enter your receipt code",check:"Check",mark:"Your mark",not_marked:"Not marked yet",e_type:"This file type isn’t allowed:",e_big:"This file is too big (max 5 MB):",e_bigt:"The files are too big together (max 12 MB).",e_receipt:"You already submitted this lab. Enter your receipt code to replace your files.",e_files:"Please choose between 1 and {n} file(s).",e_receiptnf:"We couldn’t find this receipt code.",cfL_T:"Send your files?",cfL_B:"You are sending your files as {n} ({d}), pod {p}. Only your supervisors will see them."},
fr:{title:"Quiz de la semaine",intro:"Choisis ton thème, puis un quiz ouvert. Ton superviseur décide de l’ouverture et de la fermeture de chaque quiz.",topics:"Thèmes",open_n:"ouvert(s)",back:"← Retour",closes:"Ferme",opens:"Ouvre",start:"Commencer",soon:"Pas encore ouvert",none:"Aucun quiz pour le moment.",nm:"Ton nom",dc:"Nom d’utilisateur Discord",pod:"Numéro de groupe",ql:"Langue du quiz",need:"Remplis ton nom, ton nom d’utilisateur Discord et ton numéro de groupe.",sub:"Envoyer",cfT:"Envoyer tes réponses ?",cfB:"Tu envoies en tant que {n} ({d}), groupe {p}. Tu ne pourras plus modifier tes réponses.",yes:"Oui, envoyer",no:"Revenir",score:"Ton score",pending:"Certaines réponses doivent encore être corrigées par ton superviseur. Ton score final sera mis à jour.",sent:"Ton résultat a été envoyé à ton superviseur ✓",conn:"Connexion impossible. Réessaie dans un instant.",nosetup:"Ce site n’est pas encore connecté.",tzn:"Toutes les heures sont en heure d’Algérie.",att:"Tentatives autorisées",unl:"illimitées",e_attempts:"Tu n’as plus de tentatives pour ce quiz.",e_closed:"Ce quiz est fermé.",e_notopen:"Ce quiz n’est pas encore ouvert.",e_notfound:"Ce quiz n’existe pas.",e_other:"Une erreur s’est produite. Réessaie.",right:"Correct",wrong:"Faux",corr:"Bonne réponse",model:"Réponse modèle",ph:"Écris ta réponse",q:"Question",pts:"pts",wait:"Chargement…",labs:"Travaux pratiques",upload:"Envoyer",choose_files:"Choisis ton ou tes fichiers",receipt:"Code de reçu",receipt_hint:"Seulement si tu as déjà rendu ce TP et veux remplacer tes fichiers.",got_receipt:"Ton code de reçu",keep:"Garde ce code. Il sert à voir ta note ou à remplacer tes fichiers.",copy:"Copier",copied:"Copié ✓",uploaded:"Tes fichiers ont été envoyés en privé à ton superviseur ✓",replaced:"Tes fichiers précédents ont été remplacés ✓",max_files:"Fichiers autorisés",max_size:"5 Mo maximum par fichier",check_mark:"Voir ma note de TP",enter_receipt:"Entre ton code de reçu",check:"Vérifier",mark:"Ta note",not_marked:"Pas encore noté",e_type:"Ce type de fichier n’est pas autorisé :",e_big:"Ce fichier est trop gros (5 Mo maximum) :",e_bigt:"Les fichiers sont trop gros ensemble (12 Mo maximum).",e_receipt:"Tu as déjà rendu ce TP. Entre ton code de reçu pour remplacer tes fichiers.",e_files:"Choisis entre 1 et {n} fichier(s).",e_receiptnf:"Nous n’avons pas trouvé ce code de reçu.",cfL_T:"Envoyer tes fichiers ?",cfL_B:"Tu envoies tes fichiers en tant que {n} ({d}), groupe {p}. Seuls tes superviseurs les verront."}};
let lang="en",who={n:"",d:"",p:""},TH="light",cur=null,ql="en";
const app=document.getElementById("app"),t=k=>S[lang][k];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>new Date(ms).toLocaleString(lang=="fr"?"fr-FR":"en-GB",{timeZone:"Africa/Algiers",dateStyle:"medium",timeStyle:"short"});
const L=(o,l)=>(o&&(o[l]||o.en||o.fr))||"";
const ok=()=>API.startsWith("https://");
async function get(p){if(!ok())return null;try{return await (await fetch(API+"?"+new URLSearchParams(p))).json()}catch(e){return null}}
async function post(o){if(!ok())return null;try{return await (await fetch(API,{method:"POST",body:JSON.stringify(o)})).json()}catch(e){return null}}
const hdr=()=>`<div class="top"><span></span><span><button class="lg" data-l="en">EN</button> <button class="lg" data-l="fr">FR</button></span></div>`;
const bind=fn=>app.querySelectorAll(".lg").forEach(b=>b.onclick=()=>{lang=b.dataset.l;fn()});
function msg(txt,fn){app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><p class="err">${txt}</p>`;bind(fn||home);bk.onclick=home}
function confirmBox(yes,ti,bo){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><h2>${esc(ti||t("cfT"))}</h2><p>${esc(bo||t("cfB").replace("{n}",who.n).replace("{d}",who.d).replace("{p}",who.p))}</p><p><button class="p" id="cy">${t("yes")}</button> <button id="cn">${t("no")}</button></p></div>`;document.body.appendChild(o);document.getElementById("cn").onclick=()=>o.remove();document.getElementById("cy").onclick=()=>{o.remove();yes()}}
async function home(){history.replaceState(null,"",location.pathname);
app.innerHTML=hdr()+`<h1>${t("title")}</h1><p class="mu">${t("wait")}</p>`;bind(home);
const r=await get({action:"topics"});
if(!r||!r.topics){app.innerHTML=hdr()+`<h1>${t("title")}</h1><p class="err">${ok()?t("conn"):t("nosetup")}</p>`;bind(home);return}
app.innerHTML=hdr()+`<h1>${t("title")}</h1><p class="mu">${t("intro")}</p><h2>${t("topics")}</h2><div class="grid">${r.topics.map(x=>`<button class="card topic" data-id="${esc(x.id)}">${esc(x.e)} ${esc(L(x,lang))}<small>${x.open} ${t("open_n")}</small></button>`).join("")}</div><p class="mu">${t("tzn")}</p><p><button id="rc">${t("check_mark")}</button></p>`;
bind(home);document.getElementById("rc").onclick=receiptView;app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>topicView(b.dataset.id,b.textContent))}
async function topicView(id){app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><p class="mu">${t("wait")}</p>`;bind(()=>topicView(id));bk.onclick=home;
const r=await get({action:"quizzes",topic:id});if(!r||!r.quizzes){msg(t("conn"));return}
const lb=await get({action:"labs",topic:id});const labs=(lb&&lb.labs)||[];const now=Date.now();
app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><h1>${t("topics")}</h1>`+(r.quizzes.length?r.quizzes.map(q=>`<div class="card" style="margin-bottom:12px"><b>${esc(L(q.title,lang))}</b><p class="mu">${now<q.open?t("opens")+": "+fmt(q.open):t("closes")+": "+fmt(q.close)} · ${t("att")}: ${q.att?q.att:t("unl")}</p>${now>=q.open?`<button class="p go" data-id="${q.id}">${t("start")}</button>`:`<span class="mu">${t("soon")}</span>`}</div>`).join(""):(labs.length?"":`<p class="mu">${t("none")}</p>`))+(labs.length?`<h2>${t("labs")}</h2>`+labs.map(l=>`<div class="card" style="margin-bottom:12px"><b>${esc(L(l.title,lang))}</b><p class="mu">${now<l.open?t("opens")+": "+fmt(l.open):t("closes")+": "+fmt(l.close)} · ${t("max_files")}: ${l.files}</p>${now>=l.open?`<button class="p lb" data-id="${l.id}">${t("start")}</button>`:`<span class="mu">${t("soon")}</span>`}</div>`).join(""):"")+`<p class="mu">${t("tzn")}</p>`;
bind(()=>topicView(id));bk.onclick=home;app.querySelectorAll(".go").forEach(b=>b.onclick=()=>intro(b.dataset.id));app.querySelectorAll(".lb").forEach(b=>b.onclick=()=>labIntro(b.dataset.id))}
async function intro(id){app.innerHTML=hdr()+`<p class="mu">${t("wait")}</p>`;bind(()=>intro(id));
const r=await get({action:"quiz",id});if(!r)return msg(t("conn"));
if(r.error)return msg(t("e_notfound"));
if(r.status=="upcoming")return msg(t("e_notopen")+" ("+t("opens")+": "+fmt(r.open)+")");
if(r.status=="closed")return msg(t("e_closed"));
cur=r.quiz;ql=cur.langs.indexOf(lang)>=0?lang:cur.langs[0];
app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><h1>${esc(L(cur.title,ql))}</h1><p class="mu">${t("closes")}: ${fmt(cur.close)} · ${t("att")}: ${cur.att?cur.att:t("unl")}</p>
<div class="row"><div><label>${t("nm")}</label><input type="text" id="wn" value="${esc(who.n)}"></div><div><label>${t("dc")}</label><input type="text" id="wd" value="${esc(who.d)}"></div><div><label>${t("pod")}</label><input type="text" id="wp" value="${esc(who.p)}"></div></div>
${cur.langs.length>1?`<label>${t("ql")}</label><select id="wl">${cur.langs.map(l=>`<option value="${l}" ${l==ql?"selected":""}>${l=="en"?"English":"Français"}</option>`).join("")}</select>`:""}
<p id="msg" class="err"></p><p><button class="p" id="st">${t("start")}</button></p>`;
bind(()=>{who={n:wn.value,d:wd.value,p:wp.value};intro(id)});bk.onclick=()=>topicView(cur.tid);
st.onclick=()=>{who={n:wn.value.trim(),d:wd.value.trim(),p:wp.value.trim()};if(!who.n||!who.d||!who.p){msg_.textContent=t("need");return}if(document.getElementById("wl"))ql=wl.value;quiz()}}
const msg_=new Proxy({},{get(_,k){return document.getElementById("msg")[k]},set(_,k,v){document.getElementById("msg")[k]=v;return true}});
function quiz(){
app.innerHTML=`<button id="bk">${t("back")}</button><h1>${esc(L(cur.title,ql))}</h1><p class="mu">${esc(who.n)} · ${esc(who.d)} · ${t("pod")} ${esc(who.p)}</p>`+cur.q.map((x,i)=>`<div class="q"><b>${i+1}. ${esc(L(x,ql))}</b> <span class="mu">(${x.pts} ${t("pts")})</span>${x.type=="short"?`<textarea id="a${i}" rows="3" placeholder="${t("ph")}"></textarea>`:x.opts.map(o=>`<label class="o"><input type="radio" name="a${i}" value="${o.i}"> ${esc(L(o,ql))}</label>`).join("")}</div>`).join("")+`<p id="msg" class="err"></p><button class="p" id="go">${t("sub")}</button>`;
bk.onclick=()=>intro(cur.id);go.onclick=()=>confirmBox(send);window.scrollTo(0,0)}
async function send(){const answers=cur.q.map((x,i)=>{if(x.type=="short")return document.getElementById("a"+i).value.trim().slice(0,2000);const r=document.querySelector(`input[name=a${i}]:checked`);return r?Number(r.value):null});
app.innerHTML=`<p class="mu">${t("wait")}</p>`;
const r=await post({action:"submit",id:cur.id,name:who.n,discord:who.d,pod:who.p,lang:ql,answers:answers});
if(!r)return msg(t("conn"));
if(r.error){const m={attempts:"e_attempts",closed:"e_closed",notopen:"e_notopen",notfound:"e_notfound"}[r.error]||"e_other";return msg(t(m))}
let html=`<h1>${esc(L(cur.title,ql))}</h1><div class="card"><p class="big">${r.score}/${r.max}</p><h2>${t("score")}</h2>${r.pending?`<p class="mu">${t("pending")}</p>`:""}</div><p>${t("sent")}</p>`;
if(r.review)html+=r.review.map((v,i)=>{const x=cur.q[i];let s=`<div class="q"><b>${i+1}. ${esc(L(x,ql))}</b>`;
if(v.type=="short")s+=v.model?`<p class="mu">${t("model")}: ${esc(v.model)}</p>`:"";else s+=`<p>${v.ok?"✅ "+t("right"):"❌ "+t("wrong")}</p><p class="mu">${t("corr")}: ${esc(L(x.opts[v.c],ql))}</p>`;return s+"</div>"}).join("");
app.innerHTML=html+`<p><button id="bk">${t("back")}</button></p>`;bk.onclick=home;window.scrollTo(0,0)}
const OKX=["py","c","h","cpp","hpp","java","js","ts","html","htm","css","json","php","sql","sh","ino","v","vhd","asm","cs","go","rs","kt","swift","ipynb","txt","md","csv","pdf","doc","docx","odt","rtf","ppt","pptx","odp","xls","xlsx","ods","zip","rar","7z","png","jpg","jpeg","gif","svg","pkt","drawio"];
let labCur=null,rcpv="";
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(f)});
async function labIntro(id){app.innerHTML=hdr()+`<p class="mu">${t("wait")}</p>`;bind(()=>labIntro(id));
const r=await get({action:"lab",id});if(!r)return msg(t("conn"));if(r.error)return msg(t("e_notfound"));
const l=r.lab;labCur=l;
if(r.status=="upcoming")return msg(t("e_notopen")+" ("+t("opens")+": "+fmt(l.open)+")");
if(r.status=="closed")return msg(t("e_closed"));
app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><h1>${esc(L(l.title,lang))}</h1><p class="mu">${t("closes")}: ${fmt(l.close)} · ${t("max_files")}: ${l.files} · ${t("max_size")}</p>${L(l.instr,lang)?`<div class="card" style="white-space:pre-wrap">${esc(L(l.instr,lang))}</div>`:""}
<div class="row"><div><label>${t("nm")}</label><input type="text" id="wn" value="${esc(who.n)}"></div><div><label>${t("dc")}</label><input type="text" id="wd" value="${esc(who.d)}"></div><div><label>${t("pod")}</label><input type="text" id="wp" value="${esc(who.p)}"></div></div>
<label>${t("choose_files")}</label><input type="file" id="ff" ${l.files>1?"multiple":""}>
<label>${t("receipt")}</label><input type="text" id="rcp"><p class="mu">${t("receipt_hint")}</p><p id="msg" class="err"></p><p><button class="p" id="up">${t("upload")}</button></p>`;
bind(()=>{who={n:wn.value,d:wd.value,p:wp.value};labIntro(id)});bk.onclick=()=>topicView(l.tid);
up.onclick=()=>{who={n:wn.value.trim(),d:wd.value.trim(),p:wp.value.trim()};const m=document.getElementById("msg");
if(!who.n||!who.d||!who.p){m.textContent=t("need");return}
const fl=[].slice.call(ff.files);if(!fl.length||fl.length>l.files){m.textContent=t("e_files").replace("{n}",l.files);return}
rcpv=rcp.value.trim();confirmBox(()=>labSend(fl),t("cfL_T"),t("cfL_B").replace("{n}",who.n).replace("{d}",who.d).replace("{p}",who.p))}}
function labErr(txt){msg(txt);document.getElementById("bk").onclick=()=>labIntro(labCur.id)}
async function labSend(fl){app.innerHTML=`<p class="mu">${t("wait")}</p>`;
let total=0;const files=[];
for(const f of fl){const ext=(f.name.split(".").pop()||"").toLowerCase();if(OKX.indexOf(ext)<0)return labErr(t("e_type")+" "+esc(f.name));if(f.size>5242880)return labErr(t("e_big")+" "+esc(f.name));total+=f.size;files.push({name:f.name,type:f.type,data:await b64(f)})}
if(total>12582912)return labErr(t("e_bigt"));
const r=await post({action:"lab_submit",id:labCur.id,name:who.n,discord:who.d,pod:who.p,receipt:rcpv,files:files});
if(!r)return labErr(t("conn"));
if(r.error){const m={receipt:"e_receipt",closed:"e_closed",notopen:"e_notopen",notfound:"e_notfound",files_count:"e_files",type:"e_type",too_big:"e_big",too_big_total:"e_bigt"}[r.error]||"e_other";return labErr(t(m).replace("{n}",labCur.files)+(r.name?" "+esc(r.name):""))}
app.innerHTML=`<h1>${esc(L(labCur.title,lang))}</h1><p>${r.replaced?t("replaced"):t("uploaded")}</p><div class="card"><p class="mu">${t("got_receipt")}</p><p class="big" id="rcv">${esc(r.receipt)}</p><button id="cc">${t("copy")}</button><p class="mu">${t("keep")}</p></div><p><button id="bk">${t("back")}</button></p>`;
cc.onclick=async()=>{try{await navigator.clipboard.writeText(r.receipt);cc.textContent=t("copied")}catch(e){}};bk.onclick=home;window.scrollTo(0,0)}
function receiptView(){app.innerHTML=hdr()+`<button id="bk">${t("back")}</button><h1>${t("check_mark")}</h1><label>${t("enter_receipt")}</label><input type="text" id="rcc"><p id="msg" class="err"></p><p><button class="p" id="ck">${t("check")}</button></p><div id="rs"></div>`;
bind(receiptView);bk.onclick=home;
ck.onclick=async()=>{const r=await get({action:"receipt",code:rcc.value.trim()});const m=document.getElementById("msg");m.textContent="";
if(!r){m.textContent=t("conn");return}if(r.error){m.textContent=t("e_receiptnf");rs.innerHTML="";return}
rs.innerHTML=`<div class="card"><b>${esc(L(r.title,lang))}</b><p class="mu">${esc(r.name)} · ${fmt(r.date)}</p>${r.mark==null?`<p>${t("not_marked")}</p>`:`<p class="big">${r.mark}${r.max?"/"+r.max:""}</p><p class="mu">${t("mark")}</p>`}</div>`}}
try{TH=localStorage.getItem("pods_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}
